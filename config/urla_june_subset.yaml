# Quick validation/demo config: one month over the interim Urla AOI
# (~9 scenes, ~0.5 GB). Same settings as default.yaml except the date range.
# Used for the validated run in docs/validation-run.md.
project_name: sentinel-crop-pipeline
data_provider: cdse            # cdse | gee

aoi:
  path: data/aoi/urla_ilce_interim.geojson   # polygon(s), EPSG:4326
  min_scene_overlap_pct: 60

time:
  start: "2025-06-01"
  end: "2025-06-30"
  crop: null
  crop_calendar: config/crop_calendar.yaml

search:
  collection: sentinel-2-l2a
  max_cloud_cover_pct: 20

scl_filter:
  enabled: true
  max_invalid_pct: 30
  invalid_classes: [0, 1, 3, 8, 9, 10, 11]

ai_review:
  judge_provider: none         # gemini | claude | none
  model: gemini-3.1-flash-lite
  claude_model: claude-haiku-4-5
  min_confidence: 0.6

bands:
  base: [B02, B03, B04, B08]
  extra: []

download:
  method: process_api
  resolution_m: 10
  max_auto_size_mb: 200
  out_dir: data/raw

preprocessing:
  resampling: bilinear
  normalization: reflectance
  indices: [NDVI, NDRE]
  out_dir: data/interim

patching:
  patch_size: 256
  stride: 256
  block_factor: 4
  max_invalid_frac: 0.4
  export_format: npy
  cog_dir: data/patches/cog
  train_dir: data/patches/train
  index_file: data/patches/index.csv

labeling:
  source: vector
  vector_path: data/labels/parcels.geojson
  cks_import_dir: data/raw/cks_import
  attribute: crop_type
  out_dir: data/patches/labels
  all_touched: false

split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

logging:
  dir: logs
  level: INFO

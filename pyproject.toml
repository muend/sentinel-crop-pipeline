[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-crop-pipeline"
version = "0.1.0"
description = "Sentinel-2 data preparation pipeline for crop classification: discovery, download, preprocessing, U-Net-ready patches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Muhammed Enes Duran" }]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.5",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.400"]
tfrecord = ["tensorflow>=2.13"]
ai = ["google-genai>=1.0"]        # GeminiFlashJudge (default layer-2 judge)
claude = ["anthropic>=0.25"]      # ClaudeJudge (optional layer-2 judge
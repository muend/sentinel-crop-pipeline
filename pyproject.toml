[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-crop-pipeline"
version = "0.3.1"
description = "Sentinel-2 data preparation pipeline for crop classification: discovery, download, preprocessing, U-Net-ready patches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Muhammed Enes Duran" }]
keywords = ["sentinel-2", "remote-sensing", "crop-classification", "geospatial", "copernicus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.5",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/muend/sentinel-crop-pipeline"

[project.scripts]
sentinel-crop = "sentinel_crop_pipeline.cli:main"

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.400"]
tfrecord = ["tensorflow>=2.13"]
ai = ["google-genai>=1.0"]        # GeminiFlashJudge (default layer-2 judge)
claude = ["anthropic>=0.25"]      # ClaudeJudge (optional layer-2 judge)
shapefile = ["fiona>=1.9"]        # .shp label input; GeoJSON needs nothing extra
dashboard = ["streamlit>=1.49", "pydeck>=0.8", "pandas>=2.0"]  # local review UI
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # rasterio internals set arr.shape directly; deprecated in NumPy 2.5
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
